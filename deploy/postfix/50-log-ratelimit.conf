# /etc/systemd/system/postfix.service.d/50-log-ratelimit.conf
#
# journald drops log lines from a service that sends more than ~10000 lines
# in 30 s (RateLimitIntervalSec/RateLimitBurst). A dropped Postfix line is a
# missing delivery result, so the limit is switched off for Postfix only; other
# services keep journald's flood protection.
#
# Unit name: Debian 13 runs Postfix as postfix.service. Older Debian/Ubuntu
# releases run it as the postfix@- instance; check with
#   systemctl list-units --all 'postfix*'
# and put this file in postfix@.service.d/ there instead.
#
# Apply: systemctl daemon-reload && systemctl restart postfix
# Check: systemctl show postfix -p LogRateLimitIntervalUSec   (expect 0)
[Service]
LogRateLimitIntervalSec=0
