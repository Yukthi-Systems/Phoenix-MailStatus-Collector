name: 🐛 Bug report
description: Something does not work as documented
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much as you can.
        **Security issues:** do not report them here; see [SECURITY.md](https://github.com/Yukthi-Systems/Phoenix-MailStatus-Collector/blob/main/SECURITY.md).
        **Remove real email addresses, hostnames and passwords** from anything you paste.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/Yukthi-Systems/Phoenix-MailStatus-Collector/issues) and this is not a duplicate.
          required: true
        - label: I checked the [troubleshooting table](https://github.com/Yukthi-Systems/Phoenix-MailStatus-Collector/blob/main/docs/INSTALL.md#troubleshooting).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Ideally a `journalctl -o json` excerpt that reproduces it with `-stdin -dry-run`.
      placeholder: |
        1. Send a mail to ...
        2. Postfix logs ...
        3. The published message has ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Collector version
      description: Output of `mailstatus-collector -version`
      placeholder: mailstatus-collector 1.0.1
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - systemd (release bundle / install.sh)
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Postfix version (`postconf mail_version`), systemd version (`systemctl --version | head -1`), RabbitMQ version.
      placeholder: |
        OS: Debian 13
        Postfix: 3.10.1
        systemd: 257
        RabbitMQ: 4.1
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `MAILSTATUS_*` settings, with **passwords removed**.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Collector log lines (`journalctl -u mailstatus-collector`) and related Postfix lines, anonymised.
      render: text
